name: Build and Release Server Binary

# Build and release on every commit pushed to main, then deploy it to the VM
# (deploy.yml). A release holds the server binary and the frontend build
# (frontend-<version>.tar.gz, frontend/dist), which the deploy puts in place
# as the VM's frontend/dist. Both are built here, not on the VM: it has 1 GB
# of RAM and runs the live engine.
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release-server:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      asset_name: ${{ steps.version.outputs.asset_name }}
      frontend_asset: ${{ steps.version.outputs.frontend_asset }}

    env:
      CARGO_TERM_COLOR: always
      SERVER_CRATE_MANIFEST: backend/server/Cargo.toml
      TARGET_TRIPLE: x86_64-unknown-linux-gnu

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The frontend first: a build that fails stops the release before the
      # long cargo build, and nothing is deployed.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # pnpm, not npm: pnpm-lock.yaml is the lockfile kept up to date.
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm install -g pnpm@11
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET_TRIPLE }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Derive release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          base_version=$(grep '^version = ' "$SERVER_CRATE_MANIFEST" | head -n1 | sed -E 's/version = "([^"]+)"/\1/')
          # Convert 0.1.0 -> 0.1.RUN_NUMBER
          release_version="${base_version%.*}.${GITHUB_RUN_NUMBER}"
          release_tag="server-v${release_version}"
          asset_name="server-${release_version}-${TARGET_TRIPLE}"
          frontend_asset="frontend-${release_version}.tar.gz"

          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"
          echo "frontend_asset=$frontend_asset" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        env:
          # Baked into the binary so GET /api/version reports the real release.
          # No secret is: release binaries are public, so AUTH_SECRET comes from
          # the server's .env at run time only.
          SERVER_RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: cargo build --release -p server --target "$TARGET_TRIPLE"

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/$TARGET_TRIPLE/release/server" "dist/${{ steps.version.outputs.asset_name }}"
          chmod +x "dist/${{ steps.version.outputs.asset_name }}"
          # The contents of frontend/dist, unpacked by the deploy as frontend/dist.
          test -f frontend/dist/index.html
          tar -czf "dist/${{ steps.version.outputs.frontend_asset }}" -C frontend/dist .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: Server ${{ steps.version.outputs.release_version }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/${{ steps.version.outputs.asset_name }}
            dist/${{ steps.version.outputs.frontend_asset }}

  # Every release goes live straight away, at any time of day (see deploy.yml).
  deploy:
    needs: release-server
    uses: ./.github/workflows/deploy.yml
    with:
      release_tag: ${{ needs.release-server.outputs.release_tag }}
      asset_name: ${{ needs.release-server.outputs.asset_name }}
      frontend_asset: ${{ needs.release-server.outputs.frontend_asset }}
    secrets: inherit
